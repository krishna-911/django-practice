{% extends "layout.html" %}

{% block title %}

Tweet and Twit

{% endblock %}

{% block content %}

<h1 class="text-center text-white mt-5">Welcome to tweet and twit!!</h1>

<h2>Login</h2>

</form>
<p>Dont have an account? <a href="{% url 'registration' %}">Register here</a></p>

{% endblock %}
