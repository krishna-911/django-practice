{% extends "layout.html" %}

{% block title %}

Tweet and Twit

{% endblock %}

{% block content %}

<h1 class="text-center text-white mt-5">Welcome to tweet and twit!!</h1>

<h2>Register</h2>

    {% csrf_token %}

<p>Already have an account? <a href="{% url 'login' %}">Login here</a>.</p>

{% endblock %}
